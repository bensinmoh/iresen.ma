packages:
  - .
storeDir: .cache/pnpm/store
cacheDir: .cache/pnpm/cache
saveExact: true
strictPeerDependencies: true
engineStrict: true
verifyDepsBeforeRun: error
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
enableGlobalVirtualStore: false
overrides:
  'sass@1.77.4': 1.108.1
  'undici@7.29.0': 7.30.2
  'dompurify@3.4.15': 3.4.17
  'happy-dom@20.14.5': 21.0.4
  'minimatch@10.2.6': 11.0.5
  fast-uri: 3.1.9
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  'next-intl>@swc/core': 1.16.22
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
