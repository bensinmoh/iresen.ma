packages:
  - .
storeDir: .cache/pnpm/store
cacheDir: .cache/pnpm/cache
stateDir: .cache/pnpm/state
saveExact: true
strictPeerDependencies: true
engineStrict: true
verifyDepsBeforeRun: error
enableGlobalVirtualStore: false
overrides:
  'sass@1.77.4': 1.105.1
  'undici@7.29.0': 7.29.1
  'dompurify@3.4.15': 3.4.16
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  'next-intl>@swc/core': 1.16.2
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.0'
  - playwright-core@1.64.0
  - playwright@1.64.0
