version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      payload:
        patterns: ['payload', '@payloadcms/*']
      next-react:
        patterns: ['next', 'react', 'react-dom', '@next/*', '@types/react*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
