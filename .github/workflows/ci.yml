name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: iresen
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: iresen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iresen -d iresen"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://iresen:ci-only-database-password@127.0.0.1:5432/iresen
      PAYLOAD_SECRET: ci-only-not-a-deployment-secret-at-least-32-characters
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SITE_INDEXING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:wait
      - run: pnpm cms:migrate
      - run: pnpm cms:types && pnpm cms:importmap
      - run: git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: node scripts/run.mjs playwright install --with-deps chromium
      - run: pnpm test:e2e
