name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Replace obsolete runs of the same PR; every main push keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: iresen
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: iresen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iresen -d iresen"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://iresen:ci-only-database-password@127.0.0.1:5432/iresen
      PAYLOAD_SECRET: ci-only-not-a-deployment-secret-at-least-32-characters
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SITE_INDEXING_ENABLED: 'false'
      SEARCH_WORKER_DISABLED: 'true'
      # Isolated browser contexts inject synthetic client addresses; no production proxy is configured here.
      TRUSTED_PROXY_CLIENT_IP_HEADER: x-real-ip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm db:wait
      - run: pnpm cms:migrate
      - run: pnpm cms:types && pnpm cms:importmap
      - run: git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: node scripts/run.mjs playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Verify isolated CMS interface review
        run: pnpm test:e2e tests/e2e/cms-preview.spec.ts
        env:
          CMS_INTERFACE_PREVIEW_ENABLED: 'true'
          CMS_LOCAL_REVIEW: 'true'
          CMS_WORKSPACE_ENABLED: 'true'
